<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Professional 2D CAD System - Stable Mode</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #2c3e50; color: white; font-family: sans-serif; }
        #toolbar { height: 50px; background: #34495e; display: flex; align-items: center; padding: 0 20px; z-index: 10; position: relative; border-bottom: 1px solid #2c3e50; }
        #cad-canvas { background-color: #000; display: block; cursor: crosshair; }
        .info { position: absolute; bottom: 10px; right: 10px; font-size: 12px; color: #bdc3c7; pointer-events: none; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="toolbar">
        <strong>2D CAD Design Tool</strong>
        <span style="margin-left: 20px; font-size: 14px; color: #3498db;">● 3,000パーツ最適化モード稼働中</span>
    </div>
    <canvas id="cad-canvas"></canvas>
    <div class="info">
        Parts Count: <span id="part-count">0</span> | Status: Stable
    </div>

    <script>
        const canvas = document.getElementById('cad-canvas');
        const ctx = canvas.getContext('2d');
        const partCountDisplay = document.getElementById('part-count');
        
        let shapes = [];
        let isDrawing = false;
        let startX, startY, currentX, currentY;
        let needsRedraw = false;

        // リサイズ処理
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 50;
            triggerRedraw();
        }
        window.addEventListener('resize', resize);
        resize();

        // 描画の予約（CPU負荷を最小化）
        function triggerRedraw() {
            if (!needsRedraw) {
                needsRedraw = true;
                requestAnimationFrame(render);
            }
        }

        // 実際の描画エンジン
        function render() {
            needsRedraw = false;
            
            // 画面リセット
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. 確定済みパーツの一括描画（高速化の肝）
            if (shapes.length > 0) {
                ctx.beginPath();
                ctx.strokeStyle = '#00ff00'; // CADらしいグリーン
                ctx.lineWidth = 1;
                for (let i = 0; i < shapes.length; i++) {
                    const s = shapes[i];
                    ctx.moveTo(s.x1, s.y1);
                    ctx.lineTo(s.x2, s.y2);
                }
                ctx.stroke();
            }

            // 2. 現在描画中の線のプレビュー
            if (isDrawing) {
                ctx.beginPath();
                ctx.strokeStyle = '#ffffff'; // プレビューは白
                ctx.setLineDash([5, 5]);
                ctx.moveTo(startX, startY);
                ctx.lineTo(currentX, currentY);
                ctx.stroke();
                ctx.setLineDash([]); // 破線リセット
            }

            partCountDisplay.innerText = shapes.length.toLocaleString();
        }

        // 操作イベント：mousedown
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            startX = e.clientX;
            startY = e.clientY - 50;
            currentX = startX;
            currentY = startY;
        });

        // 操作イベント：mousemove（頻繁に発生するため計算を極小化）
        window.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            currentX = e.clientX;
            currentY = e.clientY - 50;
            triggerRedraw();
        });

        // 操作イベント：mouseup
        window.addEventListener('mouseup', (e) => {
            if (!isDrawing) return;
            isDrawing = false;
            
            // データを配列に追加
            shapes.push({
                x1: startX,
                y1: startY,
                x2: e.clientX,
                y2: e.clientY - 50
            });
            triggerRedraw();
        });

        console.log("CAD Engine: High Performance Mode Initialized.");
    </script>
</body>
</html>
