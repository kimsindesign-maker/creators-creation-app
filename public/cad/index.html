<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>High-Speed 2D CAD</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #2c3e50; color: white; font-family: sans-serif; }
        #toolbar { height: 50px; background: #34495e; display: flex; align-items: center; padding: 0 20px; }
        #cad-canvas { background-color: #000; display: block; cursor: crosshair; }
        .info { position: absolute; bottom: 10px; right: 10px; font-size: 12px; color: #bdc3c7; background: rgba(0,0,0,0.7); padding: 5px; }
    </style>
</head>
<body>
    <div id="toolbar"><strong>2D CAD - Stable Engine</strong></div>
    <canvas id="cad-canvas"></canvas>
    <div class="info">Parts: <span id="cnt">0</span></div>

    <script>
        const canvas = document.getElementById('cad-canvas');
        const ctx = canvas.getContext('2d');
        const cntDisp = document.getElementById('cnt');
        
        let lines = [];
        let drawing = false;
        let startX, startY, curX, curY;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 50;
            render();
        }
        window.addEventListener('resize', resize);
        resize();

        // 描画処理：ここを極限まで軽くしました
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 1;

            // 確定済みの線を一気に引く
            ctx.beginPath();
            for (let i = 0; i < lines.length; i++) {
                ctx.moveTo(lines[i].x1, lines[i].y1);
                ctx.lineTo(lines[i].x2, lines[i].y2);
            }
            ctx.stroke();

            // 今引いている線
            if (drawing) {
                ctx.beginPath();
                ctx.strokeStyle = '#ffffff';
                ctx.moveTo(startX, startY);
                ctx.lineTo(curX, curY);
                ctx.stroke();
            }
            cntDisp.innerText = lines.length;
        }

        canvas.addEventListener('mousedown', e => {
            drawing = true;
            startX = e.clientX;
            startY = e.clientY - 50;
            curX = startX;
            curY = startY;
        });

        // マウスを動かした時、描画を「予約」するだけで計算はさせない
        window.addEventListener('mousemove', e => {
            if (!drawing) return;
            curX = e.clientX;
            curY = e.clientY - 50;
            // CPUに余裕がある時だけ描画する
            requestAnimationFrame(render);
        });

        window.addEventListener('mouseup', e => {
            if (!drawing) return;
            drawing = false;
            lines.push({x1: startX, y1: startY, x2: e.clientX, y2: e.clientY - 50});
            render();
        });
    </script>
</body>
</html>
