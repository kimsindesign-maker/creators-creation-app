<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Stable CAD Engine</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: #00ff00; }
        canvas { display: block; }
        #info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.5); padding: 5px; border: 1px solid #00ff00; }
    </style>
</head>
<body>
    <div id="info">CAD ENGINE: ONLINE | PARTS: <span id="cnt">0</span></div>
    <canvas id="cvs"></canvas>

    <script>
        const cvs = document.getElementById('cvs');
        const ctx = cvs.getContext('2d');
        const cntDisp = document.getElementById('cnt');

        let lines = [];
        let drawing = false;
        let startX, startY, curX, curY;
        let isRefreshed = true; // 描画の渋滞を防ぐ「信号機」

        function resize() {
            cvs.width = window.innerWidth;
            cvs.height = window.innerHeight;
            render();
        }
        window.addEventListener('resize', resize);
        resize();

        function render() {
            ctx.clearRect(0, 0, cvs.width, cvs.height);
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 1;

            // 確定済みの線を一括描画
            ctx.beginPath();
            for (let l of lines) {
                ctx.moveTo(l.x1, l.y1);
                ctx.lineTo(l.x2, l.y2);
            }
            ctx.stroke();

            // プレビュー線
            if (drawing) {
                ctx.beginPath();
                ctx.strokeStyle = '#fff';
                ctx.moveTo(startX, startY);
                ctx.lineTo(curX, curY);
                ctx.stroke();
            }
            cntDisp.innerText = lines.length;
            isRefreshed = true; // 描画完了
        }

        cvs.addEventListener('mousedown', e => {
            drawing = true;
            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener('mousemove', e => {
            if (!drawing || !isRefreshed) return;
            isRefreshed = false; // 前の描画が終わるまで次を拒否（フリーズ防止）
            curX = e.clientX;
            curY = e.clientY;
            requestAnimationFrame(render);
        });

        window.addEventListener('mouseup', e => {
            if (!drawing) return;
            drawing = false;
            lines.push({x1: startX, y1: startY, x2: e.clientX, y2: e.clientY});
            render();
        });
    </script>
</body>
</html>
