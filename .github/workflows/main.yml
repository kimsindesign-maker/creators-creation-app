name: Deploy to Firebase Hosting on PR
'on':
  pull_request:
    branches:
      - main 
jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CREATOR_S_CREATION }}'
          projectId: creator-s-creation
          target: creator-s-creation
