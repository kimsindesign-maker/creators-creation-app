<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>High-Performance 2D CAD</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; color: #00ff00; }
        canvas { display: block; background: #000; cursor: crosshair; }
        #stats { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 8px; border: 1px solid #00ff00; font-family: monospace; }
    </style>
</head>
<body>
    <div id="stats">STATUS: ACTIVE | PARTS: <span id="cnt">0</span></div>
    <canvas id="cad"></canvas>

    <script>
        const canvas = document.getElementById('cad');
        const ctx = canvas.getContext('2d');
        const cntDisp = document.getElementById('cnt');

        let lines = [];
        let drawing = false;
        let startX, startY, curX, curY;
        let ticking = false; // 描画の渋滞を防ぐ「安全装置」

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            draw();
        }
        window.addEventListener('resize', resize);
        resize();

        function draw() {
            ticking = false; // 描画枠を空ける
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. 確定した線を一気に描く（超軽量処理）
            ctx.beginPath();
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 1;
            for (let i = 0; i < lines.length; i++) {
                ctx.moveTo(lines[i].x1, lines[i].y1);
                ctx.lineTo(lines[i].x2, lines[i].y2);
            }
            ctx.stroke();

            // 2. 今引いている線のプレビュー
            if (drawing) {
                ctx.beginPath();
                ctx.strokeStyle = '#ffffff';
                ctx.moveTo(startX, startY);
                ctx.lineTo(curX, curY);
                ctx.stroke();
            }
            cntDisp.innerText = lines.length;
        }

        canvas.addEventListener('mousedown', e => {
            drawing = true;
            startX = e.clientX;
            startY = e.clientY;
            curX = startX;
            curY = startY;
        });

        window.addEventListener('mousemove', e => {
            if (!drawing) return;
            curX = e.clientX;
            curY = e.clientY;

            // 重要：PCの描画能力に合わせて「間引く」処理。これで落ちなくなります。
            if (!ticking) {
                requestAnimationFrame(draw);
                ticking = true;
            }
        });

        window.addEventListener('mouseup', e => {
            if (!drawing) return;
            drawing = false;
            lines.push({x1: startX, y1: startY, x2: e.clientX, y2: e.clientY});
            draw();
        });
    </script>
</body>
</html>
