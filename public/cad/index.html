<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>High-Performance 2D CAD</title>
    <style>
        :root {
            --bg-color: #f5f5f5;
            --sidebar-bg: #ffffff;
            --active-blue: #1890ff;
            --border-color: #e8e8e8;
            --text-color: #333;
        }
        body { margin: 0; padding: 0; display: flex; height: 100vh; font-family: sans-serif; background-color: var(--bg-color); overflow: hidden; color: var(--text-color); }
        
        /* ヘッダー */
        #header { position: absolute; top: 0; left: 0; right: 0; height: 48px; background: #fff; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; padding: 0 16px; z-index: 100; justify-content: space-between; }
        #logo { font-weight: bold; font-size: 16px; color: var(--active-blue); display: flex; align-items: center; gap: 8px; }
        #header-menu { display: flex; gap: 20px; font-size: 13px; color: #666; }

        /* 左サイドバー */
        #left-sidebar { width: 240px; background: var(--sidebar-bg); border-right: 1px solid var(--border-color); margin-top: 48px; z-index: 90; }
        .sb-header { padding: 12px 16px; border-bottom: 1px solid var(--border-color); font-weight: bold; font-size: 13px; background: #fafafa;}
        .tree-item { padding: 8px 16px; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: space-between;}
        .tree-item.active { background-color: #e6f7ff; color: var(--active-blue); border-right: 3px solid var(--active-blue); }
        .tag-blue { background: var(--active-blue); color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 10px; }

        /* 中央キャンバス */
        #canvas-container { flex: 1; position: relative; margin-top: 48px; background: #eee; overflow: hidden; display: flex; align-items: center; justify-content: center;}
        canvas { background: #ffffff; box-shadow: 0 0 10px rgba(0,0,0,0.1); cursor: crosshair; }
        
        /* ツールバー */
        #toolbar { position: absolute; top: 10px; left: 10px; background: #fff; border: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 4px; border-radius: 4px; }
        .tool-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 2px; margin-bottom: 2px; font-size: 18px;}
        .tool-btn:hover { background: #f0f0f0; }
        .tool-btn.active { background: var(--active-blue); color: #fff; }

        /* 右サイドバー */
        #right-sidebar { width: 280px; background: var(--sidebar-bg); border-left: 1px solid var(--border-color); margin-top: 48px; z-index: 90; display: flex; flex-direction: column;}
        .prop-item { padding: 8px 16px; font-size: 12px; display: flex; border-bottom: 1px solid #f0f0f0;}
        .prop-label { width: 70px; color: #999; }
        
        #layer-tabs { display: flex; background: #fafafa; border-bottom: 1px solid var(--border-color); }
        .tab { flex: 1; text-align: center; padding: 10px; font-size: 12px; cursor: pointer; }
        .tab.active { border-bottom: 2px solid var(--active-blue); color: var(--active-blue); font-weight: bold; background: #fff;}
        
        .layer-item { padding: 12px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #f0f0f0; font-size: 13px;}
        .layer-icon { width: 32px; height: 32px; background: #f9f9f9; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; }
        .btn-add { margin: 16px; padding: 10px; background: var(--active-blue); color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;}
    </style>
</head>
<body>
    <div id="header">
        <div id="logo">POWER-STRUCTURE</div>
        <div id="header-menu"><div>ファイル</div><div>編集</div><div>レイヤー</div><div>設定</div></div>
        <div style="font-size: 13px;">真之介</div>
    </div>

    <div id="left-sidebar">
        <div class="sb-header">パワー構造</div>
        <div class="tree-item">全体図 <span style="color:#ccc">全体図</span></div>
        <div class="tree-item active">A-1 <span class="tag-blue">図面</span></div>
    </div>

    <div id="canvas-container">
        <div id="toolbar">
            <div class="tool-btn active">✥</div>
            <div class="tool-btn">／</div>
            <div class="tool-btn">◯</div>
            <div class="tool-btn">⬜</div>
        </div>
        <canvas id="cadCanvas"></canvas>
    </div>

    <div id="right-sidebar">
        <div class="sb-header">A-1</div>
        <div class="prop-item"><div class="prop-label">図面番号:</div><div>A-1</div></div>
        <div class="prop-item"><div class="prop-label">寸法:</div><div>1:1</div></div>
        <div id="layer-tabs"><div class="tab">線種</div><div class="tab active">個別レイヤー</div></div>
        <div class="layer-item">
            <div class="layer-icon">／</div>
            <div style="flex:1">正面図(1)<br><small style="color:var(--active-blue)">全選択 (1個)</small></div>
            <div>👁</div>
        </div>
        <button class="btn-add">+ 個別レイヤーを追加</button>
    </div>

    <script>
        const canvas = document.getElementById('cadCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 600;
        canvas.height = 400;

        // 初期描画（Figmaにあった一本の線）
        function drawInitial() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.beginPath();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.moveTo(100, 250);
            ctx.lineTo(500, 180);
            ctx.stroke();
        }
        drawInitial();
    </script>
</body>
</html>
