<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>High-Performance 2D CAD</title>
    <style>
        :root {
            --bg-color: #f5f5f5;
            --sidebar-bg: #ffffff;
            --active-blue: #1890ff;
            --border-color: #e8e8e8;
            --text-color: #333;
        }
        body { margin: 0; padding: 0; display: flex; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: var(--bg-color); overflow: hidden; color: var(--text-color); }
        
        /* ヘッダー */
        #header { position: absolute; top: 0; left: 0; right: 0; height: 48px; background: #fff; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; padding: 0 16px; z-index: 100; justify-content: space-between; }
        #logo { font-weight: bold; font-size: 16px; color: var(--active-blue); display: flex; align-items: center; gap: 8px; }
        #header-menu { display: flex; gap: 24px; font-size: 14px; color: #666; }
        #user-info { display: flex; align-items: center; gap: 8px; font-size: 14px; }

        /* 左サイドバー（ツリー） */
        #left-sidebar { width: 260px; background: var(--sidebar-bg); border-right: 1px solid var(--border-color); margin-top: 48px; display: flex; flex-direction: column; z-index: 90; }
        .sb-header { padding: 12px 16px; border-bottom: 1px solid var(--border-color); font-weight: bold; font-size: 14px; display: flex; justify-content: space-between; align-items: center;}
        .tree-item { padding: 8px 16px 8px 32px; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px;}
        .tree-item:hover { background-color: #f0f7ff; }
        .tree-item.active { background-color: #e6f7ff; color: var(--active-blue); border-right: 3px solid var(--active-blue); }
        .tree-item .tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #eee; color: #666; margin-left: auto;}
        .tree-item.active .tag { background: var(--active-blue); color: #fff; }

        /* 中央キャンバスエリア */
        #canvas-container { flex: 1; position: relative; margin-top: 48px; overflow: hidden; }
        canvas { display: block; background: #ffffff; cursor: crosshair; }
        
        /* ツールバー（キャンバス上） */
        #floating-toolbar { position: absolute; top: 16px; left: 16px; background: #fff; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); display: flex; padding: 4px; gap: 4px; z-index: 80; border: 1px solid var(--border-color);}
        .tool-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 4px; cursor: pointer; color: #555;}
        .tool-btn:hover { background-color: #f5f5f5; }
        .tool-btn.active { background-color: var(--active-blue); color: #fff; }

        /* 右サイドバー（プロパティ） */
        #right-sidebar { width: 280px; background: var(--sidebar-bg); border-left: 1px solid var(--border-color); margin-top: 48px; z-index: 90; display: flex; flex-direction: column;}
        .prop-group { border-bottom: 1px solid var(--border-color); }
        .prop-header { padding: 12px 16px; background: #fafafa; font-weight: bold; font-size: 13px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;}
        .prop-item { padding: 8px 16px; display: flex; align-items: center; font-size: 13px; }
        .prop-label { width: 80px; color: #888; }
        .prop-value { flex: 1; font-weight: 500; }
        
        /* レイヤーセクション */
        #layer-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        #layer-tabs { display: flex; border-bottom: 1px solid var(--border-color); background: #fafafa;}
        .layer-tab { flex: 1; text-align: center; padding: 10px 0; font-size: 13px; cursor: pointer; color: #888; }
        .layer-tab.active { color: var(--active-blue); border-bottom: 2px solid var(--active-blue); font-weight: bold; background: #fff;}
        #layer-list { flex: 1; overflow-y: auto; padding: 8px 0; }
        .layer-item { padding: 8px 16px; display: flex; align-items: center; gap: 10px; font-size: 13px; cursor: pointer;}
        .layer-item:hover { background-color: #f5f5f5; }
        .layer-icon { width: 36px; height: 36px; background: #f0f0f0; border-radius: 4px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-color);}
        .layer-info { flex: 1; }
        .layer-name { font-weight: 500; }
        .layer-count { font-size: 11px; color: #999; }
        .layer-action { color: #ccc; cursor: pointer; }
        .layer-action:hover { color: var(--active-blue); }
        
        #add-layer-btn { margin: 16px; padding: 8px; background: #fff; border: 1px solid var(--active-blue); color: var(--active-blue); border-radius: 4px; text-align: center; cursor: pointer; font-size: 13px; font-weight: bold;}
        #add-layer-btn:hover { background: #e6f7ff; }

        /* ステータスバー */
        #status-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 24px; background: var(--active-blue); color: #fff; font-size: 12px; display: flex; align-items: center; padding: 0 16px; z-index: 100; }

        /* SVGアイコン（Figma準拠） */
        .icon { width: 16px; height: 16px; fill: currentColor; }
    </svg>
</head>

Figmaは「静止画の設計図」でしたが、このコードによって、同じ見た目を持った「実際に線を引ける試作機」へと進化します。

### あなたのCADが「Figmaと同じ姿」になる手順

今のCursorにある `index.html` の中身をすべて消して、上記の新しいコードを貼り付けて保存（**Ctrl + S**）してください。

その後、ターミナルで以下の2つのコマンドを順番に実行してください。

1.  `npx firebase use creators-creation-app` （宛先の確認）
2.  `npx firebase deploy` （出図・公開）

### 完了後の確認

デプロイ完了後、ブラウザで [https://creators-creation-app.web.app](https://creators-creation-app.web.app) を開き、**Ctrl + F5** を連打して更新してください。

Figmaにあった「左側のツリー」「右側のプロパティ」「中央のツールバー」がすべて配置され、その中央の白いキャンバスには、**マウスを激しく動かしても落ちない（フリーズしない）安全な描画エンジン**が組み込まれています。

これで、見た目も中身も、あなたの理想とするCADアプリの第一歩が完成します！
