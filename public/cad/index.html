<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Stable 2D CAD</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; color: #00ff00; font-family: monospace; }
        #toolbar { height: 40px; background: #333; display: flex; align-items: center; padding: 0 15px; border-bottom: 1px solid #555; }
        canvas { background-color: #000; display: block; }
        .stats { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.8); padding: 5px 10px; border: 1px solid #00ff00; }
    </style>
</head>
<body>
    <div id="toolbar">SYSTEM: STABLE DRAWING MODE</div>
    <canvas id="cad-canvas"></canvas>
    <div class="stats">PARTS: <span id="cnt">0</span></div>

    <script>
        const canvas = document.getElementById('cad-canvas');
        const ctx = canvas.getContext('2d');
        const cntDisp = document.getElementById('cnt');

        let lines = [];
        let isDrawing = false;
        let startX, startY, curX, curY;
        let requestID = null; // 描画予約の管理用

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 40;
            render();
        }
        window.addEventListener('resize', resize);
        resize();

        function render() {
            // 描画が重ならないように予約を解除
            requestID = null;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 1;

            // 1. 確定済みの線を一括描画（最速のパス）
            ctx.beginPath();
            ctx.strokeStyle = '#00ff00';
            for (let i = 0; i < lines.length; i++) {
                ctx.moveTo(lines[i].x1, lines[i].y1);
                ctx.lineTo(lines[i].x2, lines[i].y2);
            }
            ctx.stroke();

            // 2. 現在作成中のプレビュー線
            if (isDrawing) {
                ctx.beginPath();
                ctx.strokeStyle = '#ffffff';
                ctx.moveTo(startX, startY);
                ctx.lineTo(curX, curY);
                ctx.stroke();
            }
            cntDisp.innerText = lines.length;
        }

        // マウス操作の最適化
        canvas.addEventListener('mousedown', e => {
            isDrawing = true;
            startX = e.clientX;
            startY = e.clientY - 40;
            curX = startX;
            curY = startY;
        });

        window.addEventListener('mousemove', e => {
            if (!isDrawing) return;
            curX = e.clientX;
            curY = e.clientY - 40;

            // 重要：パラパラ漫画のように、前の描画が終わってから次を描く（フリーズ防止）
            if (!requestID) {
                requestID = requestAnimationFrame(render);
            }
        });

        window.addEventListener('mouseup', e => {
            if (!isDrawing) return;
            isDrawing = false;
            lines.push({x1: startX, y1: startY, x2: e.clientX, y2: e.clientY - 40});
            render();
        });
    </script>
</body>
</html>
