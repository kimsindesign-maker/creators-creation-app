<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>High-Performance 2D CAD</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; color: #00ff00; }
        canvas { display: block; background: #000; cursor: crosshair; }
        #stats { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 8px; border: 1px solid #00ff00; font-family: monospace; }
    </style>
</head>
<body>
    <div id="stats">STATUS: ACTIVE | PARTS: <span id="cnt">0</span></div>
    <canvas id="cad"></canvas>

    <script>
        const canvas = document.getElementById('cad');
        const ctx = canvas.getContext('2d');
        const cntDisp = document.getElementById('cnt');

        /** 確定線のみ保持（描画ループ内では push しない） */
        const lines = [];

        /** 確定線を焼き付けるオフスクリーン（メインはプレビューと合成のみ） */
        const staticCanvas = document.createElement('canvas');
        const staticCtx = staticCanvas.getContext('2d');

        let drawing = false;
        let startX, startY, curX, curY;

        /** 進行中の requestAnimationFrame を表す。コールバック完了まで次のスケジュールを無視する */
        let rafId = null;

        function scheduleRedraw() {
            if (rafId !== null) return;
            rafId = requestAnimationFrame(() => {
                rafId = null;
                draw();
            });
        }

        function strokeCommittedLine(targetCtx, line) {
            targetCtx.beginPath();
            targetCtx.strokeStyle = '#00ff00';
            targetCtx.lineWidth = 1;
            targetCtx.moveTo(line.x1, line.y1);
            targetCtx.lineTo(line.x2, line.y2);
            targetCtx.stroke();
        }

        /** リサイズ時のみ全件を静的レイヤーに再焼き付け（1ストロークにバッチ） */
        function rebuildStaticLayer() {
            staticCtx.clearRect(0, 0, staticCanvas.width, staticCanvas.height);
            if (lines.length === 0) return;
            staticCtx.beginPath();
            staticCtx.strokeStyle = '#00ff00';
            staticCtx.lineWidth = 1;
            for (let i = 0; i < lines.length; i++) {
                staticCtx.moveTo(lines[i].x1, lines[i].y1);
                staticCtx.lineTo(lines[i].x2, lines[i].y2);
            }
            staticCtx.stroke();
        }

        function resize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            canvas.width = w;
            canvas.height = h;
            staticCanvas.width = w;
            staticCanvas.height = h;
            rebuildStaticLayer();
            draw();
        }
        window.addEventListener('resize', resize);
        resize();

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(staticCanvas, 0, 0);

            if (drawing) {
                ctx.beginPath();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 1;
                ctx.moveTo(startX, startY);
                ctx.lineTo(curX, curY);
                ctx.stroke();
            }
            cntDisp.innerText = lines.length;
        }

        canvas.addEventListener('mousedown', e => {
            drawing = true;
            startX = e.clientX;
            startY = e.clientY;
            curX = startX;
            curY = startY;
            scheduleRedraw();
        });

        window.addEventListener('mousemove', e => {
            if (!drawing) return;
            curX = e.clientX;
            curY = e.clientY;
            scheduleRedraw();
        });

        window.addEventListener('mouseup', e => {
            if (!drawing) return;
            drawing = false;

            const line = { x1: startX, y1: startY, x2: e.clientX, y2: e.clientY };
            lines.push(line);
            strokeCommittedLine(staticCtx, line);

            draw();
        });
    </script>
</body>
</html>
